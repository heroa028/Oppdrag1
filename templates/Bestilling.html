<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forside</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/Logo1.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">

</head>

<body>
    <nav class="Navbar">
        <a href="{{url_for('index')}}"><img src="{{ url_for('static', filename='images/Logo1.png') }}" alt=""></a>
        <h1> <span style="color: violet">S</span>uper-PC</h1>
    </nav>


    <h4>Lag din egen pc her:</h4>
    <section class="Butikk">


        <section class="Dropdowns">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div style="color: red; font-weight: bold; margin-bottom: 10px;">
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}
            <form method="POST" action="/Confirmation1">
                <label for="Farge"><span style="color:violet">V</span>elg en farge:</label>

                <select name="Farge" id="Farge" required>
                    <option value="0" id="Velg" class="Velg" disabled selected>----------</option>
                    {%for farge in Farge%}
                    <option type="button" value="{{farge}}">{{farge}}</option>
                    {%endfor%}
                </select>
                <label for="Cpu"><span style="color:violet">V</span>elg en Prosessor:</label>
                <select name="Cpu" id="Cpu" required>
                    <option value="0" id="Velg" class="Velg" disabled selected>----------</option>
                    {%for cpu in Cpu%}
                    <option value="{{ cpu['Navn'] }}">{{ cpu['Navn'] }} - {{ cpu['pris'] }} kr</option>
                    {%endfor%}

                </select>

                <label for="Gpu"><span style="color:violet">V</span>elg ett grafikkort:</label>
                <select name="Gpu" id="Gpu" required>
                    <option value="0" class="Velg" disabled selected>----------</option>
                    {%for gpu in Gpu%}
                    <option value="{{ gpu['Navn'] }}">{{ gpu['Navn'] }} - {{ gpu['pris'] }} kr</option>
                    {%endfor%}

                </select>

                <label for="Ram"><span style="color:violet">V</span>elg en mengde DDR5 RAM:</label>
                <select name="Ram" id="Ram" required>
                    <option id="Velg" value="0" class="Velg" disabled selected>----------</option>
                    {%for ram in Ram%}
                    <option value="{{ ram['Navn'] }}">{{ ram['Navn'] }} - {{ ram['pris'] }} kr</option>
                    {%endfor%}


                </select>
                <a href=""> <button class="Submit" type="submit" id="Submit">Velg PC</button> </a>
        </section>


        </form>



    </section>

</body>

</html>
